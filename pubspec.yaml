name: food_app
description: "A new Flutter project for Food Delivery."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0' # Flutter versiyonuna göre burası değişebilir

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Network ve State Management Paketleri
  dio: ^5.4.0
  provider: ^6.1.1
  cached_network_image: ^3.3.0

  # Animasyon Paketi (Kotlin'deki Lottie karşılığı)
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # ASSETS (Dosya Tanımlama) kısmı burasıdır:
  assets:
    - assets/motorcycle.json
    # Eğer başka resimlerin varsa buraya ekleyebilirsin:
    # - assets/images/logo.png